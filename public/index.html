<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tynderella Store</title>
<link rel="icon" type="image/png" href="assets/logo-sapatinho-transparent.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:#0B0B0F;
  font-family:'Outfit',system-ui,sans-serif;
  cursor:pointer;
  user-select:none;
}

/* Radial glow */
.glow{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(55% 55% at 50% 50%,rgba(120,18,66,.5) 0%,transparent 70%);
  pointer-events:none;
}

/* Grid */
.grid-bg{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent 80%);
  mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent 80%);
  pointer-events:none;
}

/* Floating product items */
.float-item{
  position:fixed;
  width:72px;height:72px;
  border-radius:16px;overflow:hidden;
  border:1px solid rgba(242,134,198,.25);
  box-shadow:0 4px 24px rgba(0,0,0,.5),0 0 12px rgba(242,134,198,.12);
  opacity:.85;
  z-index:1;
  transition:opacity .3s;
}
.float-item img{width:100%;height:100%;object-fit:cover;display:block;}
.float-item:hover{opacity:1;}

@keyframes float-bob{
  0%,100%{transform:rotate(var(--r)) translateY(0);}
  50%{transform:rotate(var(--r)) translateY(-14px);}
}

/* Stars */
.star{
  position:fixed;z-index:2;
  color:rgba(242,134,198,.6);
  animation:twinkle var(--d) ease-in-out var(--dl) infinite;
  pointer-events:none;
}
@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.85);}
  50%{opacity:.9;transform:scale(1.1);}
}

/* Center */
.center{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;pointer-events:none;
}

.crown{
  color:#EBD687;
  filter:drop-shadow(0 0 20px rgba(235,214,135,.6));
  animation:float-bob 3.5s ease-in-out infinite;
  --r:0deg;
}

.title{
  font-family:'Great Vibes',cursive;
  font-size:clamp(52px,8vw,96px);
  font-weight:400;
  color:#F5F5F5;
  line-height:1;
  text-shadow:0 0 40px rgba(242,134,198,.4),0 0 80px rgba(242,134,198,.2);
}

.tagline{
  font-size:clamp(12px,1.5vw,15px);
  font-weight:300;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(245,245,245,.45);
}

.hint{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(242,134,198,.35);
  margin-top:8px;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{
  0%,100%{opacity:.35;}
  50%{opacity:.8;}
}

/* Fade out on click */
body.leaving{
  animation:fade-out .5s ease forwards;
}
@keyframes fade-out{
  to{opacity:0;}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="grid-bg"></div>

<!-- Stars -->
<svg class="star" style="top:14%;left:8%;--d:2.2s;--dl:0s" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"/></svg>
<svg class="star" style="top:18%;left:88%;--d:2.8s;--dl:1.4s" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"/></svg>
<svg class="star" style="top:72%;right:6%;--d:2.4s;--dl:2.8s" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"/></svg>
<svg class="star" style="top:65%;left:4%;--d:3s;--dl:0.8s" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"/></svg>
<svg class="star" style="top:30%;right:4%;--d:2.6s;--dl:2s" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"/></svg>

<!-- Floating products (16 items = 8 unique x2) -->
<div id="floats"></div>

<!-- Center content -->
<div class="center">
  <svg class="crown" width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
    <path d="M2 19h20v2H2v-2zM2 17l4-8 6 4 4-7 4 7-2 4H2zM12 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
  </svg>
  <h1 class="title">Tynderella Store</h1>
  <p class="tagline">Break the spell.</p>
  <span class="hint">toque para entrar</span>
</div>

<script>
var products = [
  'assets/produto-bong-heel.jpeg',
  'assets/produto-bong-apple.jpeg',
  'assets/produto-bong-cylinder.jpeg',
  'assets/produto-bong-blue.png',
  'assets/produto-bowl-blue.png',
  'assets/produto-bowl-skull.png',
  'assets/produto-torch-slim.png',
  'assets/produto-torch-silver.png'
];

// Two concentric rings around center (8 inner + 8 outer)
var items = products.concat(products);
var container = document.getElementById('floats');
var SIZE = 72; // item px

function place() {
  var W = window.innerWidth, H = window.innerHeight;
  var cx = W / 2, cy = H / 2;
  // radii: inner ~28% of shortest dim, outer ~44%
  var rInner = Math.min(W, H) * 0.28;
  var rOuter = Math.min(W, H) * 0.44;
  // adjust for non-square: use separate x/y radii
  var rxI = rInner * (W / Math.min(W,H) > 1.4 ? 1.35 : 1);
  var ryI = rInner;
  var rxO = rOuter * (W / Math.min(W,H) > 1.4 ? 1.4 : 1);
  var ryO = rOuter;

  var allEls = container.querySelectorAll('.float-item');
  allEls.forEach(function(el, i) {
    var isOuter = i >= 8;
    var idx = isOuter ? i - 8 : i;
    var total = 8;
    // offset outer ring by half-step for interlacing
    var offset = isOuter ? (Math.PI / total) : 0;
    var angle = (2 * Math.PI * idx / total) + offset - Math.PI / 2;
    var rx = isOuter ? rxO : rxI;
    var ry = isOuter ? ryO : ryI;
    var x = cx + rx * Math.cos(angle) - SIZE / 2;
    var y = cy + ry * Math.sin(angle) - SIZE / 2;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
  });
}

items.forEach(function(src, i) {
  var delay = (i * 0.22).toFixed(2);
  var dur   = (3.2 + (i % 5) * 0.3).toFixed(1);
  var rot   = ((i % 3 - 1) * 8) + 'deg';
  var el = document.createElement('div');
  el.className = 'float-item';
  el.style.cssText = [
    'position:fixed',
    'animation:float-bob '+dur+'s ease-in-out '+delay+'s infinite',
    '--r:'+rot
  ].join(';');
  var img = document.createElement('img');
  img.src = src;
  img.alt = '';
  el.appendChild(img);
  container.appendChild(el);
});

// Position items in rings
place();
window.addEventListener('resize', place);

// Click anywhere to enter store
document.body.addEventListener('click', function() {
  document.body.classList.add('leaving');
  setTimeout(function() {
    window.location.href = 'store.html';
  }, 480);
});
</script>
</body>
</html>
