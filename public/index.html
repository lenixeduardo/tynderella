<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tynderella Store</title>
<link rel="icon" type="image/png" href="assets/logo-sapatinho-transparent.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:#09090b;
  font-family:'Outfit',system-ui,sans-serif;
  cursor:pointer;
  user-select:none;
}

/* ── Perspective orbit layer ── */
.orbit-layer{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
  /* perspective tilt like the reference */
  perspective:1200px;
  transform:perspective(1200px) rotateX(15deg);
  transform-origin:center bottom;
  opacity:1;
}

/* Each ring spins around the center */
.ring{
  position:absolute;
  top:50%;left:50%;
  border-radius:50%;
  animation:spin-ring var(--spd) linear infinite var(--dir,normal);
}
.ring-inner{
  --spd:50s;
  width:var(--rw);height:var(--rw);
  margin:calc(var(--rw)/-2) 0 0 calc(var(--rw)/-2);
}
.ring-outer{
  --spd:70s;--dir:reverse;
  width:var(--rw);height:var(--rw);
  margin:calc(var(--rw)/-2) 0 0 calc(var(--rw)/-2);
}

@keyframes spin-ring{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* Item on ring: counter-rotate so image stays upright */
.orbit-item{
  position:absolute;
  width:72px;height:72px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(242,134,198,.3);
  box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 12px rgba(242,134,198,.1);
  /* placed via JS at angle on ring, counter-rotated */
}
.orbit-item img{width:100%;height:100%;object-fit:cover;display:block;}

/* Bottom gradient — fades orbit into background */
.fade-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:5;
  height:50%;pointer-events:none;
  background:linear-gradient(to top,#09090b 10%,rgba(9,9,11,.8) 45%,transparent 100%);
}

/* Bottom content */
.content{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;pointer-events:none;
}

.crown{
  color:#EBD687;
  filter:drop-shadow(0 0 18px rgba(235,214,135,.7));
  animation:crown-float 3.5s ease-in-out infinite;
  margin-bottom:2px;
}
@keyframes crown-float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

.title{
  font-family:'Great Vibes',cursive;
  font-size:clamp(52px,8vw,96px);
  font-weight:400;line-height:1;
  color:#F5F5F5;
  text-shadow:0 0 40px rgba(242,134,198,.4),0 0 80px rgba(242,134,198,.15);
}

.tagline{
  font-size:clamp(11px,1.4vw,14px);
  font-weight:300;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(245,245,245,.4);
}

.hint{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(242,134,198,.3);
  animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{
  0%,100%{opacity:.3;}50%{opacity:.75;}
}

/* Fade out on click */
body.leaving{animation:fade-out .5s ease forwards;}
@keyframes fade-out{to{opacity:0;}}
</style>
</head>
<body>

<!-- Perspective orbit rings -->
<div class="orbit-layer" id="orbit-layer"></div>

<!-- Bottom gradient fade -->
<div class="fade-bottom"></div>

<!-- Bottom content -->
<div class="content">
  <svg class="crown" width="56" height="56" viewBox="0 0 24 24" fill="currentColor">
    <path d="M2 19h20v2H2v-2zM2 17l4-8 6 4 4-7 4 7-2 4H2zM12 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
  </svg>
  <h1 class="title">Tynderella Store</h1>
  <p class="tagline">Break the spell.</p>
  <span class="hint">toque para entrar</span>
</div>

<script>
var PRODUCTS = [
  'assets/produto-bong-heel.jpeg',
  'assets/produto-bong-apple.jpeg',
  'assets/produto-bong-cylinder.jpeg',
  'assets/produto-bong-blue.png',
  'assets/produto-bowl-blue.png',
  'assets/produto-bowl-skull.png',
  'assets/produto-torch-slim.png',
  'assets/produto-torch-silver.png'
];
var ITEMS = PRODUCTS.concat(PRODUCTS); // 16 total
var ITEM_SIZE = 72;

function buildRings() {
  var layer = document.getElementById('orbit-layer');
  layer.innerHTML = '';

  var W = window.innerWidth, H = window.innerHeight;
  // ring diameters relative to viewport
  var rInner = Math.min(W, H) * 0.62;
  var rOuter = Math.min(W, H) * 0.95;

  function makeRing(items, radius, cls, angleOffset) {
    var ring = document.createElement('div');
    ring.className = 'ring ' + cls;
    ring.style.setProperty('--rw', radius + 'px');
    layer.appendChild(ring);

    items.forEach(function(src, i) {
      var angle = (360 / items.length) * i + angleOffset;
      var rad = angle * Math.PI / 180;
      var r = radius / 2; // radius from center
      // position item center on ring circumference
      var x = r * Math.cos(rad) + r - ITEM_SIZE / 2;
      var y = r * Math.sin(rad) + r - ITEM_SIZE / 2;

      var el = document.createElement('div');
      el.className = 'orbit-item';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      // counter-rotate so image stays upright as ring spins
      el.style.animation = 'spin-ring ' + (cls === 'ring-inner' ? '50s' : '70s') +
        ' linear infinite ' + (cls === 'ring-inner' ? 'reverse' : 'normal');

      var img = document.createElement('img');
      img.src = src; img.alt = '';
      el.appendChild(img);
      ring.appendChild(el);
    });
  }

  makeRing(ITEMS.slice(0, 8),  rInner, 'ring-inner', 0);
  makeRing(ITEMS.slice(8, 16), rOuter, 'ring-outer', 22.5);
}

buildRings();
window.addEventListener('resize', buildRings);

document.body.addEventListener('click', function() {
  document.body.classList.add('leaving');
  setTimeout(function(){ window.location.href = 'store.html'; }, 480);
});
</script>
</body>
</html>
