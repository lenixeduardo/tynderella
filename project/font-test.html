<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Great+Vibes&family=Pinyon+Script&family=Parisienne&family=Tangerine:wght@700&family=Alex+Brush&family=Sacramento&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>

.par{font-family:'Parisienne',cursive;}
.tan{font-family:'Tangerine',cursive;}

<body>
<div class="row"><div class="lbl">Allura</div><span class="t allura">Tynderella</span> <span class="t pink allura">Store</span></div>

<div class="row"><div class="lbl">Alex Brush</div><span class="t alex">Tynderella</span> <span class="t pink alex">Store</span></div>
<div class="row"><div class="lbl">Sacramento</div><span class="t sac">Tynderella</span> <span class="t pink sac">Store</span></div>
<div class="row"><div class="lbl">Dancing Script</div><span class="t dan">Tynderella</span> <span class="t pink dan">Store</span></div>
</body></html>
